name: E2E y DAST

# HU23: valida el sitio publicado. Se dispara cuando Vercel termina un despliegue de
# producción (evento vercel.deployment.success o deployment_status), a demanda y cada semana.
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL a probar
        required: true
        default: https://pc2-pfc-iii.vercel.app
  schedule:
    - cron: "0 12 * * 1" # lunes 07:00 hora Lima, sobre producción

permissions:
  contents: read

env:
  # Se prueba siempre el dominio público de producción: las URL únicas de cada
  # despliegue pueden estar protegidas por Vercel Deployment Protection.
  TARGET_URL: ${{ github.event.inputs.url || 'https://pc2-pfc-iii.vercel.app' }}
  BASE_URL: ${{ github.event.inputs.url || 'https://pc2-pfc-iii.vercel.app' }}

concurrency:
  group: e2e-dast-${{ github.event.inputs.url || 'produccion' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E · Playwright
    # Solo despliegues de producción (las vistas previas se validan en el PR).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production') || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas E2E contra ${{ env.BASE_URL }}
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  dast:
    name: DAST · OWASP ZAP
    needs: e2e
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production') || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Escaneo pasivo (baseline)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
